<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Convidados</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --panel: rgba(255, 251, 245, 0.96);
      --panel-strong: #fffdf8;
      --text: #2f241d;
      --muted: #7b695d;
      --line: rgba(74, 49, 29, 0.12);
      --accent: #a23e2c;
      --green: #246c43;
      --green-soft: #d8efdf;
      --red: #9f2f2f;
      --red-soft: #f7d6d6;
      --shadow: 0 18px 45px rgba(77, 49, 26, 0.12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(162, 62, 44, 0.14), transparent 28%),
        radial-gradient(circle at top right, rgba(36, 108, 67, 0.1), transparent 25%),
        linear-gradient(180deg, #f3eadb 0%, #f7f4ee 42%, #efe5d8 100%);
    }

    .app-shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      gap: 24px;
      align-items: stretch;
      margin-bottom: 22px;
    }

    .hero > div,
    .toolbar,
    .list-header,
    .guest-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .hero > div:first-child { padding: 28px; }
    .eyebrow {
      margin: 0 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 800;
      font-size: 0.78rem;
      color: var(--accent);
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 0.95;
    }

    .hero-copy {
      max-width: 60ch;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 18px;
    }

    .stat-card {
      padding: 18px;
      border-radius: 20px;
      background: var(--panel-strong);
      border: 1px solid var(--line);
    }

    .stat-card span {
      display: block;
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    .stat-card strong { font-size: 2rem; }
    .stat-card.highlight { background: linear-gradient(135deg, #fff1eb, #fae3d6); }

    .toolbar,
    .list-header { margin-bottom: 22px; }

    .toolbar {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: end;
      padding: 18px;
    }

    .search-box { flex: 1; }
    .sort-box { min-width: 240px; }
    .search-box span,
    .sort-box span {
      display: block;
      margin-bottom: 8px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .search-box input,
    .sort-box select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px 16px;
      font: inherit;
      background: #fffdfa;
      color: var(--text);
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-button,
    .reset-button,
    .action-button,
    .counter-button {
      border: none;
      cursor: pointer;
      font: inherit;
      transition: transform 140ms ease, background-color 140ms ease, opacity 140ms ease;
    }

    .filter-button,
    .reset-button {
      padding: 12px 16px;
      border-radius: 999px;
    }

    .filter-button {
      background: #efe7dc;
      color: var(--text);
      font-weight: 700;
    }

    .filter-button.active {
      background: var(--text);
      color: #fff;
    }

    .reset-button {
      background: #f7e2dd;
      color: var(--accent);
      font-weight: 800;
    }

    .list-header {
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .list-header p {
      margin: 0;
      color: var(--muted);
      font-weight: 700;
    }

    .guest-list {
      display: grid;
      gap: 16px;
    }

    .guest-card { padding: 20px; }

    .guest-card__title-row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .guest-name {
      margin: 0;
      font-size: 1.15rem;
    }

    .guest-meta {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .status-pill {
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      background: #ebe3d8;
      color: var(--muted);
    }

    .guest-card.present .status-pill {
      background: var(--green-soft);
      color: var(--green);
    }

    .guest-card.absent .status-pill {
      background: var(--red-soft);
      color: var(--red);
    }

    .guest-card__actions {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .presence-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .action-button {
      padding: 12px 18px;
      border-radius: 14px;
      font-weight: 800;
    }

    .action-button--present {
      background: #eaf6ee;
      color: var(--green);
    }

    .action-button--absent {
      background: #f9e7e7;
      color: var(--red);
    }

    .guest-card.present .action-button--present {
      background: var(--green);
      color: #fff;
    }

    .guest-card.absent .action-button--absent {
      background: var(--red);
      color: #fff;
    }

    .counter-box {
      display: flex;
      gap: 14px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 16px;
      background: #fffdfa;
      border: 1px solid var(--line);
      min-width: 250px;
    }

    .counter-box span {
      color: var(--muted);
      font-weight: 700;
    }

    .counter-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .counter-button {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #efe7dc;
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .counter-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .counter-value {
      min-width: 32px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .empty-state {
      padding: 28px;
      text-align: center;
      background: var(--panel);
      border-radius: 24px;
      border: 1px solid var(--line);
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    @media (max-width: 880px) {
      .hero { grid-template-columns: 1fr; }
      .toolbar,
      .list-header,
      .guest-card__actions {
        flex-direction: column;
        align-items: stretch;
      }
      .counter-box { min-width: 100%; }
    }

    @media (max-width: 580px) {
      .app-shell {
        width: min(100% - 20px, 100%);
        padding-top: 18px;
      }
      .hero > div:first-child,
      .guest-card,
      .toolbar,
      .list-header { padding: 18px; }
      .stats-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <section class="hero">
      <div>
        <p class="eyebrow">Lista interativa</p>
        <h1>Controle de presenca dos convidados</h1>
        <p class="hero-copy">Marque quem compareceu ao evento e registre quantas pessoas entraram com o convidado principal.</p>
      </div>
      <div class="stats-grid">
        <article class="stat-card"><span>Total de convidados</span><strong id="totalGuests">0</strong></article>
        <article class="stat-card"><span>Confirmados no local</span><strong id="presentGuests">0</strong></article>
        <article class="stat-card"><span>Ausentes</span><strong id="absentGuests">0</strong></article>
        <article class="stat-card highlight"><span>Pessoas que entraram</span><strong id="enteredPeople">0</strong></article>
      </div>
    </section>

    <section class="toolbar">
      <label class="search-box" for="searchInput">
        <span>Buscar convidado</span>
        <input id="searchInput" type="search" placeholder="Digite um nome, observacao ou mesa">
      </label>

      <label class="sort-box" for="sortSelect">
        <span>Ordenar por</span>
        <select id="sortSelect">
          <option value="alphabetical">Ordem alfabetica</option>
          <option value="table">Numero da mesa</option>
        </select>
      </label>

      <div class="filter-group" role="group" aria-label="Filtrar convidados">
        <button class="filter-button active" data-filter="all">Todos</button>
        <button class="filter-button" data-filter="present">Presentes</button>
        <button class="filter-button" data-filter="absent">Ausentes</button>
        <button class="filter-button" data-filter="pending">Pendentes</button>
      </div>
    </section>

    <section class="list-header">
      <p id="resultLabel">Carregando convidados...</p>
      <button class="reset-button" id="resetButton" type="button">Limpar marcacoes</button>
    </section>

    <section id="guestList" class="guest-list" aria-live="polite"></section>
  </main>

  <template id="guestCardTemplate">
    <article class="guest-card">
      <div class="guest-card__title-row">
        <h2 class="guest-name"></h2>
        <span class="status-pill">Pendente</span>
      </div>
      <p class="guest-meta"></p>

      <div class="guest-card__actions">
        <div class="presence-actions" role="group" aria-label="Acoes de presenca">
          <button class="action-button action-button--present" data-action="present" type="button">Presente</button>
          <button class="action-button action-button--absent" data-action="absent" type="button">Nao veio</button>
        </div>

        <div class="counter-box">
          <span>Pessoas que entraram</span>
          <div class="counter-controls">
            <button class="counter-button" data-action="decrease" type="button">-</button>
            <output class="counter-value">0</output>
            <button class="counter-button" data-action="increase" type="button">+</button>
          </div>
        </div>
      </div>
    </article>
  </template>

  <script>
    const storageKey = "controle-convidados-casamento";

    const baseGuests = [
      { name: "Ademir Alvez", invited: 4, table: "4", notes: "Padrinhos" },
      { name: "Alanna Alves", invited: 2, table: "11", notes: "Padrinhos" },
      { name: "Alice", invited: 2, table: "11", notes: "" },
      { name: "Alliny", invited: 2, table: "8", notes: "" },

      { name: "Elson", invited: 2, table: "19", notes: "" },
      { name: "Erenice", invited: 2, table: "13", notes: "" },
      { name: "Fabineia", invited: 1, table: "3", notes: "" },
      { name: "Fabiola", invited: 3, table: "11", notes: "" },
      { name: "Fran", invited: 3, table: "19", notes: "" },
      { name: "Genilson", invited: 2, table: "18", notes: "" },
      { name: "Ilza Souza", invited: 2, table: "19", notes: "" },
      { name: "Isabel Ferreira", invited: 3, table: "18", notes: "Tia da Noiva" },
      { name: "Isabel Gomes", invited: 1, table: "7", notes: "" },

      { name: "Marcos Prado", invited: 3, table: "20", notes: "" },
      { name: "Marcos Rodrigues e Josicleide", invited: 2, table: "1", notes: "Pais do Noivo" },

      { name: "Paulinha/familia e amigos", invited: 6, table: "15", notes: "" },
      { name: "Pedro Henrique", invited: 1, table: "5", notes: "" },

      { name: "Ray Santos", invited: 3, table: "17", notes: "" },
      { name: "Regiane dos Santos", invited: 2, table: "17", notes: "" },
      { name: "Rosa Maria", invited: 2, table: "6", notes: "Tia da Noiva" },
      { name: "Rosangela Costa", invited: 2, table: "3", notes: "Tia da Noiva" },
      { name: "Rosiane Custodio", invited: 3, table: "3", notes: "Tios da Noiva" },
      { name: "Rubens", invited: 1, table: "4", notes: "Padrinhos" },
      { name: "Samara Menezes", invited: 2, table: "6", notes: "" },
      { name: "Siqueira", invited: 2, table: "13", notes: "" },
      { name: "Suellen Nascimento", invited: 2, table: "1", notes: "Irma da Noiva" },
      { name: "Sueli Silva", invited: 2, table: "13", notes: "" },
      { name: "Taty Barbosa", invited: 1, table: "2", notes: "" },
      { name: "Tio Charles", invited: 3, table: "9", notes: "Familia do Noivo" },
      { name: "Tio Fabio", invited: 3, table: "9", notes: "Familia do Noivo" },
      { name: "Val familia", invited: 3, table: "12", notes: "" },
      { name: "Vanessa e Oziel", invited: 2, table: "5", notes: "" },
      { name: "Vania", invited: 2, table: "16", notes: "" },
      { name: "Vito Daniel e Sara", invited: 2, table: "9", notes: "Familia do Noivo" }
    ].map(function (guest, index) {
      return {
        id: index + 1,
        name: guest.name,
        invited: guest.invited,
        table: guest.table,
        notes: guest.notes,
        status: "pending",
        entered: 0
      };
    });

    var searchInput = document.getElementById("searchInput");
    var guestList = document.getElementById("guestList");
    var resultLabel = document.getElementById("resultLabel");
    var totalGuests = document.getElementById("totalGuests");
    var presentGuests = document.getElementById("presentGuests");
    var absentGuests = document.getElementById("absentGuests");
    var enteredPeople = document.getElementById("enteredPeople");
    var resetButton = document.getElementById("resetButton");
    var template = document.getElementById("guestCardTemplate");
    var filterButtons = Array.prototype.slice.call(document.querySelectorAll(".filter-button"));
    var sortSelect = document.getElementById("sortSelect");

    var currentFilter = "all";
    var currentSort = "alphabetical";
    var guests = loadGuests();

    function cloneGuests(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function loadGuests() {
      var saved = localStorage.getItem(storageKey);
      if (!saved) return cloneGuests(baseGuests);

      try {
        var parsed = JSON.parse(saved);
        return baseGuests.map(function (guest) {
          var savedGuest = parsed.find(function (item) { return item.id === guest.id; });
          return savedGuest ? Object.assign({}, guest, savedGuest) : guest;
        });
      } catch (error) {
        return cloneGuests(baseGuests);
      }
    }

    function saveGuests() {
      localStorage.setItem(storageKey, JSON.stringify(guests));
    }

    function getStatusLabel(status) {
      if (status === "present") return "Presente";
      if (status === "absent") return "Ausente";
      return "Pendente";
    }

    function normalizeText(value) {
      return String(value || "").toLowerCase();
    }

    function matchesFilter(guest) {
      return currentFilter === "all" ? true : guest.status === currentFilter;
    }

    function matchesSearch(guest) {
      var query = normalizeText(searchInput.value.trim());
      if (!query) return true;

      return normalizeText([guest.name, guest.notes, guest.table, String(guest.invited)].join(" ")).indexOf(query) !== -1;
    }

    function buildMeta(guest) {
      var parts = ["Convidados na lista: " + guest.invited];
      if (guest.table) parts.push("Mesa: " + guest.table);
      if (guest.notes) parts.push(guest.notes);
      return parts.join(" - ");
    }

    function updateSummary(filteredGuests) {
      totalGuests.textContent = guests.reduce(function (sum, guest) { return sum + guest.invited; }, 0);
      presentGuests.textContent = guests.filter(function (guest) { return guest.status === "present"; }).length;
      absentGuests.textContent = guests.filter(function (guest) { return guest.status === "absent"; }).length;
      enteredPeople.textContent = guests.reduce(function (sum, guest) { return sum + guest.entered; }, 0);
      resultLabel.textContent = filteredGuests.length + " convidado(s) exibido(s)";
    }

    function sortGuests(list) {
      var copy = list.slice();

      copy.sort(function (a, b) {
        if (currentSort === "table") {
          var tableA = Number(a.table || 9999);
          var tableB = Number(b.table || 9999);
          if (tableA !== tableB) return tableA - tableB;
        }
        return a.name.localeCompare(b.name, "pt-BR");
      });

      return copy;
    }

    function renderGuests() {
      guestList.innerHTML = "";

      var filteredGuests = sortGuests(
        guests.filter(function (guest) {
          return matchesFilter(guest) && matchesSearch(guest);
        })
      );

      updateSummary(filteredGuests);

      if (!filteredGuests.length) {
        var emptyState = document.createElement("div");
        emptyState.className = "empty-state";
        emptyState.textContent = "Nenhum convidado encontrado com esse filtro.";
        guestList.appendChild(emptyState);
        return;
      }

      filteredGuests.forEach(function (guest) {
        var fragment = template.content.cloneNode(true);
        var card = fragment.querySelector(".guest-card");
        var name = fragment.querySelector(".guest-name");
        var meta = fragment.querySelector(".guest-meta");
        var status = fragment.querySelector(".status-pill");
        var counterValue = fragment.querySelector(".counter-value");
        var decreaseButton = fragment.querySelector('[data-action="decrease"]');
        var increaseButton = fragment.querySelector('[data-action="increase"]');
        var presentButton = fragment.querySelector('[data-action="present"]');
        var absentButton = fragment.querySelector('[data-action="absent"]');

        card.dataset.id = String(guest.id);
        card.classList.toggle("present", guest.status === "present");
        card.classList.toggle("absent", guest.status === "absent");

        name.textContent = guest.name;
        meta.textContent = buildMeta(guest);
        status.textContent = getStatusLabel(guest.status);
        counterValue.textContent = guest.entered;

        var canChangeCounter = guest.status === "present";
        decreaseButton.disabled = !canChangeCounter || guest.entered <= 0;
        increaseButton.disabled = !canChangeCounter || guest.entered >= guest.invited;
        presentButton.setAttribute("aria-pressed", String(guest.status === "present"));
        absentButton.setAttribute("aria-pressed", String(guest.status === "absent"));

        guestList.appendChild(fragment);
      });
    }

    function setGuestStatus(id, status) {
      guests = guests.map(function (guest) {
        if (guest.id !== id) return guest;
        if (status === "absent") return Object.assign({}, guest, { status: status, entered: 0 });
        return Object.assign({}, guest, { status: status, entered: guest.entered || 1 });
      });
      saveGuests();
      renderGuests();
    }

    function updateEnteredPeople(id, delta) {
      guests = guests.map(function (guest) {
        if (guest.id !== id || guest.status !== "present") return guest;
        var nextValue = Math.max(0, Math.min(guest.invited, guest.entered + delta));
        return Object.assign({}, guest, { entered: nextValue });
      });
      saveGuests();
      renderGuests();
    }

    guestList.addEventListener("click", function (event) {
      var button = event.target.closest("button");
      if (!button) return;

      var card = button.closest(".guest-card");
      if (!card) return;

      var id = Number(card.dataset.id);
      var action = button.getAttribute("data-action");

      if (action === "present" || action === "absent") setGuestStatus(id, action);
      if (action === "increase") updateEnteredPeople(id, 1);
      if (action === "decrease") updateEnteredPeople(id, -1);
    });

    filterButtons.forEach(function (button) {
      button.addEventListener("click", function () {
        currentFilter = button.getAttribute("data-filter");
        filterButtons.forEach(function (item) {
          item.classList.toggle("active", item === button);
        });
        renderGuests();
      });
    });

    searchInput.addEventListener("input", renderGuests);
    sortSelect.addEventListener("change", function () {
      currentSort = sortSelect.value;
      renderGuests();
    });

    resetButton.addEventListener("click", function () {
      guests = cloneGuests(baseGuests);
      localStorage.removeItem(storageKey);
      renderGuests();
    });

    renderGuests();
  </script>
</body>
</html>
